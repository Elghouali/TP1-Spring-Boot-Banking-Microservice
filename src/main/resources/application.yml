server:
  port: 8081
spring:
  application:
    name: tp1-compte-service
  datasource:
    url: jdbc:h2:mem:comptesdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    rest:
      base-path: /data-rest
      default-page-size: 20
  graphql:
    path: /graphql
    graphiql:
      enabled: true
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info
